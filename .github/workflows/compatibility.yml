name: Isolated report engines
on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Motores separados por espaço; vazio executa todo o catálogo'
        required: false
        type: string
permissions:
  contents: read
jobs:
  matrix:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated runtimes and Maven
        shell: pwsh
        run: ./compatibility/Prepare-Tools.ps1
      - name: Compile Java 8 worker
        shell: pwsh
        run: ./compatibility/Build-Worker.ps1
      - name: Exercise actual engines
        shell: pwsh
        env:
          REQUESTED_VERSIONS: ${{ inputs.versions }}
        run: |
          $versions=@($env:REQUESTED_VERSIONS -split '\s+' | Where-Object {$_})
          foreach($v in $versions){if($v -notmatch '^\d+\.\d+\.\d+$'){throw 'Versão inválida'}}
          node compatibility/Test-Matrix.mjs --fresh @versions
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Test feature boundaries and preservation
        shell: pwsh
        run: |
          node compatibility/Test-Features.mjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node compatibility/Test-Smoke.mjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node --test tests/compatibility.test.mjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-evidence
          path: compatibility/results/*.json
