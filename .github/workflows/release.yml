name: Release
on:
  push:
    branches: [main]
    paths: ['jasperstudio-update-v2.8.1.zip']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-unificada-281
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Importar atualização verificada sem modificar workflows
        shell: pwsh
        run: |
          if ((Get-FileHash jasperstudio-update-v2.8.1.zip).Hash -ne '860C45314600C986B6D2A0E917C07A4B899732F216CD64B9FAE7C48C76CDA691') { throw 'Arquivo de fontes divergente' }
          $stage = Join-Path $env:RUNNER_TEMP 'source-update-281'
          Expand-Archive -LiteralPath jasperstudio-update-v2.8.1.zip -DestinationPath $stage
          Get-ChildItem -LiteralPath $stage | Where-Object Name -notin @('.git','.github') | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination . -Recurse -Force }
          node scripts/Verify.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Integridade de fontes/binários divergente' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- ':!.github'
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'feat: consolidar pacote unificado 2.8.1 e portes exatos do Studio'
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Publicação dos fontes recusada' }
          }
      - name: Testar fontes e coletor
        shell: pwsh
        run: |
          node scripts/Verify.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/gestao-export.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build/release-tests | Out-Null
          javac -encoding UTF-8 -d build/release-tests modules/connection-order/src/com/salutem/order/GlobalSearchEngine.java tests/GlobalSearchEngineTest.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp build/release-tests com.salutem.order.GlobalSearchEngineTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Criar rascunho de lançamento preservando releases existentes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.8.1 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'A release 2.8.1 já existe; nenhuma substituição automática será feita.' }
          $commit = git rev-parse HEAD
          gh release create v2.8.1 --target $commit --draft --title '2.8.1 — Pacote Unificado de Personalização do Jaspersoft Studio' --notes-file docs/releases/v2.8.1.md
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível criar o rascunho.' }